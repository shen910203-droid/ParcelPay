<title>ParcelPay 送貨本</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.badge{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mut);border:0}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600;letter-spacing:.5px}
.mut{color:var(--mut);font-size:14px}.acc{color:var(--acc)}.okc{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--warn)}
.big{font-size:40px;font-weight:700;line-height:1.1}.big small{font-size:16px;color:var(--mut);font-weight:500}
.mid{font-size:24px;font-weight:700}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.totoday{display:block;margin:-4px auto 12px}
.offbtn{width:100%;margin-bottom:12px;padding:12px;color:var(--warn)}
.offbox{text-align:center;padding:10px 0}.offbox .big{color:var(--warn)}.offbox button{margin-top:12px}
tr.dim td{color:var(--mut)}
.runtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}.runtop b{font-size:16px}.runtop .mut{margin-left:auto}
body.running nav{display:none}body.running{padding-bottom:calc(24px + env(safe-area-inset-bottom))}body.running .undo,body.running .toast{bottom:calc(16px + env(safe-area-inset-bottom))}
.rangeline{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.bigbtn{width:100%;padding:16px 8px;font-size:16px;font-weight:600;margin-bottom:12px}button.okbg{background:var(--ok);border-color:var(--ok)}
.nextcard .bigbtn{margin-bottom:8px}.editbtn{display:block;margin:0 auto}
.offbtn small{color:var(--mut);font-size:12px}.offbtn{line-height:1.4;margin:0}
.evlist{display:flex;flex-direction:column;gap:6px}

.evr .tm{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}.evr b{font-size:16px;font-variant-numeric:tabular-nums}
.evr .sub{color:var(--tx);font-size:14px;line-height:1.3;word-break:break-all}
.evr .del{background:none;border:0;color:var(--mut);font-size:20px;padding:6px 0;min-height:36px}

.tg-m{color:var(--warn);background:rgba(245,165,36,.12)}.tg-x{color:var(--acc);background:rgba(79,140,255,.12)}.tg-r{color:var(--bad);background:rgba(255,93,93,.12)}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,130px);align-items:center;gap:8px}
.stp .n{width:24px;height:24px;border-radius:50%;background:var(--card2);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:12px}
.stp.ok .n{background:var(--ok);color:#fff}.stp input{min-height:38px;padding:6px 10px}
.lk[disabled] .evr .del{display:none}
.evtot{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.evtot span{font-size:14px;font-weight:600;border-radius:8px;padding:4px 10px}
.evr .no{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.sec2{border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}.sec2:first-child{margin-top:0}
.sech2{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--card2);border:0;border-radius:0;padding:12px;text-align:left}
.sech2 b{font-size:16px}.sech2 .tag{padding:3px 8px;white-space:nowrap}.chev{color:var(--mut);font-size:12px}
.sec2 .evlist{padding:8px}
.htab{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums;table-layout:fixed}
.htab th{font-size:12px;color:var(--mut);font-weight:500;padding:4px 2px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htab td{text-align:center;font-size:20px;font-weight:600;color:var(--tx);padding:6px 2px;border-top:1px solid var(--line)}
.htab td:first-child,.htab th:first-child{text-align:left;font-size:12px;color:var(--mut);font-weight:500;width:40px}

.htab th:last-child,.htab td:last-child{width:56px}
.tline{font-size:14px;color:var(--mut);margin-top:6px}.tline b{color:var(--tx)}
.dedr{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 4px 6px 10px}
.dedr .sub{font-size:14px;color:var(--mut);word-break:break-all}.dedr .del,.rsn .del{background:none;border:0;color:var(--mut);font-size:20px;min-height:36px}
.dedadd{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px}

.rsn button[disabled]{opacity:.3}
.tg-o{color:var(--mut);background:rgba(138,147,166,.15)}
button.ev.k{color:var(--mut)}.acrow{display:flex;justify-content:space-between;gap:8px;white-space:nowrap}

.acres.okb{border-color:rgba(46,204,113,.5);background:rgba(46,204,113,.08)}.acres.badb{border-color:rgba(255,93,93,.5);background:rgba(255,93,93,.08)}

<body>
<header><h1><img src="icon.svg" alt="" class="logo">ParcelPay <span class="sub">送貨本</span></h1><div class="hdr-r"><button id="eye" class="badge" onclick="toggleMoney()" aria-label="隱藏金額">$</button><button id="badge" class="badge" onclick="manualSync()">—</button></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<div class="undo" id="undo"><span></span><button onclick="undo()">復原</button></div>

<script>
/* ================= 資料 ================= */
const APP_VERSION='v4.7';
const LS='songhuoben_v1';
const DEF_SETTINGS={id:'main',rate:2.5,payOffset:13,weeklyFixed:0,fuelPerKm:0,me:'Aiden',partner:'Frankie',
  reasons:['地址錯誤','無人簽收','拒收','包裹損壞','找不到地址','其他'],updatedAt:0};
let S={days:{},fuel:{},weeks:{},settings:{...DEF_SETTINGS},pending:[],local:{url:'',token:''},ui:{num:{fuel:true,fixed:false},den:{commute:false,sort:true,deliver:true},period:'thisweek',from:'',to:''}};
function load(){
  try{const j=JSON.parse(localStorage.getItem(LS)||'null');
    if(j){S={...S,...j};S.settings={...DEF_SETTINGS,...(j.settings||{})};S.ui={...S.ui,...(j.ui||{})};}
  }catch(e){console.error(e)}
}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('本機儲存失敗')}}

/* ================= 工具 ================= */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const weekStart=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const payday=ws=>addDays(ws,Number(S.settings.payOffset)||13);
const md=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}`};
const wd=s=>'日一二三四五六'[pd(s).getDay()];
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n*100)/100).toFixed(2);
const moneyH=n=>S.ui.hideMoney?'$ •••':money(n);
const num=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
function mins(a,b){if(!a||!b)return null;const[h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<0)d+=1440;return d}
const hm=m=>m==null?'—':`${Math.floor(m/60)}h${pad(m%60)}m`;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}

/* ================= 計算 ================= */
function newDay(date){return{id:date,date,total:'',start:'',end:'',missing:[],multi:[],returns:[],fReturns:[],sup:{on:false,name:'',fDel:'',sRet:''},
  t:{leave:'',arrive:'',start:'',end:'',home:''},kmB:'',offType:'',offMiss:'',ded:[],acStart:'',acEnd:'',skip:[],note:'',updatedAt:0,deleted:false}}
function getDay(date){const d=S.days[date];return d&&!d.deleted?d:newDay(date)}
function calc(d){
  const s=num(d.start),e=num(d.end),T=num(d.total),rate=Number(S.settings.rate)||0;
  const offType=d.offType||(d.off?'all':''),meOff=offType==='me',allOff=offType==='all';
  const has=!offType&&s!=null&&e!=null&&e>=s;
  const inR=no=>has&&no>=s&&no<=e;
  const skipIn=has?(d.skip||[]).filter(x=>inR(x.no)).length:0;
  const numbers=has?e-s+1-skipIn:0;
  // 每個編號的件數 = max(標記的多件數, 該號缺件+退件數)；例如 150 直接退 2 件，就代表 150 有 2 件
  const perNo={};const bump=(no,k,q)=>{if(!inR(no))return;(perNo[no]=perNo[no]||{multi:0,used:0});perNo[no][k]+=q};
  d.multi.forEach(m=>{if(inR(m.no))(perNo[m.no]=perNo[m.no]||{multi:0,used:0}).multi=Math.max(perNo[m.no]?perNo[m.no].multi:0,m.qty)});
  if(!offType){d.missing.forEach(m=>bump(m.no,'used',m.qty));d.returns.forEach(r=>bump(r.no,'used',r.qty))}
  const extra=sum(Object.values(perNo),v=>Math.max(0,Math.max(v.multi,v.used)-1));
  const assigned=numbers+extra;
  const myMissing=sum(d.missing.filter(m=>inR(m.no)),m=>m.qty);
  const otherMissing=meOff?(num(d.offMiss)||0):sum(d.missing.filter(m=>!inR(m.no)),m=>m.qty);
  const myRet=has?sum(d.returns,r=>r.qty):0;
  const fRet=allOff?0:sum(d.fReturns,r=>r.qty);
  const counts=has||meOff;   // 這天要不要統計同區件數
  const delivered=has?assigned-myMissing-myRet:0;
  const sup=d.sup||{},supOn=!allOff&&!!sup.on,sRet=supOn?(num(sup.sRet)||0):0,supName=(sup.name||'').trim()||'支援';
  let fDelivered,sDelivered=null;
  if(allOff){fDelivered=null}
  else if(supOn){fDelivered=num(sup.fDel);sDelivered=(counts&&T!=null&&fDelivered!=null)?T-assigned-otherMissing-fDelivered-fRet-sRet:null}
  else fDelivered=(counts&&T!=null)?T-assigned-otherMissing-fRet:null;
  const km=num(d.kmB);
  const warn=[];
  if(s!=null&&e!=null&&e<s)warn.push('結束編號小於起始編號');
  d.returns.filter(r=>has&&!inR(r.no)).forEach(r=>warn.push(`退件 ${r.no} 不在你的範圍`));
  d.returns.filter(r=>d.missing.some(m=>m.no===r.no)).forEach(r=>warn.push(`${r.no} 同時記了缺件和退件，會被扣兩次`));
  if(!supOn&&fDelivered!=null&&fDelivered<0)warn.push(`${S.settings.partner} 算出負數：總件數或範圍可能填錯`);
  if(supOn&&sDelivered!=null&&sDelivered<0)warn.push(`${supName} 算出負數：${S.settings.partner} 的件數或總件數可能有誤`);
  if(supOn&&fDelivered==null)warn.push(`今天有支援：要填 ${S.settings.partner} 說他送了幾件，才能算出 ${supName}`);
  if(T!=null&&has&&assigned>T)warn.push('你的範圍件數已超過總件數');
  (d.skip||[]).filter(k=>d.missing.some(m=>m.no===k.no)||d.multi.some(m=>m.no===k.no)||d.returns.some(r=>r.no===k.no)).forEach(k=>warn.push(`${k.no} 記成跳號（沒這個號），但又有缺件/多件/退件`));
  if(meOff&&T==null)warn.push('我休假：填總件數，才能算出同事的件數');
  const ded=sum((d.ded||[]).filter(x=>x.confirmed),x=>Number(x.amount)||0),dedPend=sum((d.ded||[]).filter(x=>!x.confirmed),x=>Number(x.amount)||0);
  return{skipIn,ded,dedPend,netPay:delivered*rate-ded,has,meOff,allOff,offType,counts,numbers,extra,assigned,myMissing,otherMissing,myRet,fRet,delivered,fDelivered,supOn,sDelivered,sRet,supName,
    pay:delivered*rate,fPay:fDelivered==null?null:fDelivered*rate,km,
    commute:(()=>{const a=mins(d.t.leave,d.t.arrive),b=mins(d.t.end,d.t.home);return a==null&&b==null?null:(a||0)+(b||0)})(),sort:mins(d.t.arrive,d.t.start),deliver:mins(d.t.start,d.t.end),warn,T};
}
function liveDays(){return Object.values(S.days).filter(d=>!d.deleted)}
function fills(){return Object.values(S.fuel).filter(x=>!x.deleted&&num(x.liters)>0&&num(x.amount)>0).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.updatedAt||0)-(b.updatedAt||0))}
/* 長期油耗：每次「加滿且有 A」為一段，該段公升 = 上次加滿後所有加油（含沒加滿的）*/
function consumption(){
  let km=0,L=0,n=0,acc=0;
  for(const x of fills()){
    acc+=Number(x.liters);
    if(x.full!==false){
      if(num(x.tripA)>0){km+=Number(x.tripA);L+=acc;n++}
      acc=0;
    }
  }
  return n&&L>0?{kmPerL:km/L,lPerKm:L/km,km,L,n}:null;
}
/* 某天的油價：當天以前最近一次加油的單價（油箱裡就是那批油） */
function priceOn(date){
  const f=fills();if(!f.length)return null;
  let p=null;for(const x of f){if(x.date<=date)p=x;else break}
  p=p||f[0];return{price:x2(p.amount/p.liters),from:p.date};
}
const x2=v=>Number(v);
function costPerKmOn(date){
  const c=consumption(),p=priceOn(date);
  if(c&&p)return{v:c.lPerKm*p.price,src:'auto',price:p.price,from:p.from,kmPerL:c.kmPerL};
  return{v:Number(S.settings.fuelPerKm)||0,src:'manual'};
}
const dayFuel=(d,c)=>(c.km||0)*costPerKmOn(d.date).v;
function weekWorkDays(){const m={};liveDays().forEach(d=>{if(calc(d).has){const w=weekStart(d.date);m[w]=(m[w]||0)+1}});return m}

/* ================= 存檔 / 同步 ================= */
function touch(type,rec){rec.updatedAt=Date.now();S[type][rec.id]=rec;persist();queue(type,rec.id)}
function touchSettings(){S.settings.updatedAt=Date.now();persist();queue('settings','main')}
function queue(type,id){S.pending=S.pending.filter(p=>!(p.type===type&&p.id===id));S.pending.push({type,id});persist();badge();clearTimeout(queue.t);queue.t=setTimeout(flush,1500)}
let syncing=false,syncErr='';
function recOf(type,id){return type==='settings'?S.settings:S[type][id]}
function summaryOf(type,r){
  if(type==='days'){const c=calc(r);return{'日期':r.date,'總件數':r.total,'範圍':c.has?`${r.start}-${r.end}`:'',
    '我送達':c.has?c.delivered:'','我薪資':c.has?c.pay:'','我退件':c.myRet,'Frankie送達':c.fDelivered??'','Frankie退件':c.fRet,'支援送達':c.sDelivered??'',
    '缺件':r.missing.map(m=>m.qty>1?`${m.no}x${m.qty}`:m.no).join(' '),'多件':r.multi.map(m=>`${m.no}x${m.qty}`).join(' '),
    '退件明細':r.returns.map(x=>`${x.no}x${x.qty}(${x.reason})`).join(' '),'公里':c.km??'','油錢':c.km!=null?Math.round(dayFuel(r,c)*100)/100:'','發薪日':payday(weekStart(r.date)),'備註':r.note}}
  if(type==='fuel')return{'日期':r.date,'金額':r.amount,'公升':r.liters,'TripA':r.tripA,'油價':r.liters?r.amount/r.liters:'','km/L':(r.tripA&&r.liters)?r.tripA/r.liters:'','備註':r.note};
  if(type==='weeks')return{'週起':r.id,'發薪日':payday(r.id),'實際入帳':r.received,'備註':r.note};
  return{};
}
async function api(body){
  const r=await fetch(S.local.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:S.local.token})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'伺服器錯誤');return j;
}
async function flush(){
  if(!S.local.url||syncing||!S.pending.length){badge();return}
  if(!navigator.onLine){syncErr='離線';badge();return}
  syncing=true;badge();
  const batch=S.pending.slice(0,40).map(p=>{const r=recOf(p.type,p.id);return r?{type:p.type,id:p.id,ts:r.updatedAt,data:r,summary:summaryOf(p.type,r)}:null}).filter(Boolean);
  try{
    await api({action:'upsert',items:batch});
    batch.forEach(b=>{const r=recOf(b.type,b.id);if(r&&r.updatedAt===b.ts)S.pending=S.pending.filter(p=>!(p.type===b.type&&p.id===b.id))});
    syncErr='';persist();
  }catch(e){syncErr=errMsg(e)}
  syncing=false;badge();
  if(S.pending.length&&!syncErr)setTimeout(flush,300);
}
async function pull(silent){
  if(!S.local.url)return;
  syncing=true;badge();
  try{
    const j=await api({action:'pull'});let n=0;
    (j.items||[]).forEach(it=>{
      const d=it.data;if(!d)return;
      if(it.type==='settings'){if((d.updatedAt||0)>(S.settings.updatedAt||0)){S.settings={...DEF_SETTINGS,...d};n++}return}
      if(!S[it.type])return;
      const l=S[it.type][it.id];
      if(!l||(d.updatedAt||0)>(l.updatedAt||0)){S[it.type][it.id]=d;n++}
    });
    syncErr='';persist();if(!silent)toast(`已從雲端更新 ${n} 筆`);if(n&&!(document.activeElement&&document.activeElement.matches('input,textarea')))render();
  }catch(e){syncErr=errMsg(e);if(!silent)toast('下載失敗：'+syncErr)}
  syncing=false;badge();flush();
}
const errMsg=e=>/fetch|network|load failed|json|unexpected/i.test(e&&e.message||'')?(navigator.onLine?'連不到雲端':'無網路'):(e&&e.message)||'失敗';
function toggleMoney(){S.ui.hideMoney=!S.ui.hideMoney;persist();render();toast(S.ui.hideMoney?'金額已隱藏':'金額已顯示')}
function badge(){const ey=document.getElementById('eye');if(ey){ey.textContent=S.ui.hideMoney?'$ 隱藏':'$';ey.classList.toggle('on',!!S.ui.hideMoney)}
  const b=document.getElementById('badge');let t,c='';
  if(!S.local.url){t='未連雲端';c='warn'}
  else if(syncing){t='同步中…'}
  else if(syncErr){t=S.pending.length?`待同步 ${S.pending.length} · ${syncErr}`:syncErr;c=syncErr==='無網路'?'warn':'bad'}
  else if(S.pending.length){t=`待同步 ${S.pending.length}`;c='warn'}
  else{t='已同步';c='ok'}
  b.textContent=t;b.className='badge '+c;
}
function manualSync(){if(!S.local.url){go('set');return}syncErr='';flush().then(()=>pull(false))}

function formulaHTML(c){const P=esc(S.settings.partner),N=esc(c.supName);if(!c.counts||c.T==null)return'';
  const mine=c.meOff?'':` − 我範圍 ${c.assigned}`,ml=c.meOff?'缺件':`${P}範圍缺件`;

function sumTable(c){

   +secHTML('missing','缺件','m',myMiss,`${sum(myMiss,x=>x.qty)} 件`,x=>`<b>${x.no}</b><span class="sub">${x.qty>1?`×${x.qty}`:''}</span>`)
   +secHTML('multi','多件','x',myMulti,`${myMulti.length} 號 · +${mk} 件${dv?`<span class="mut" style="font-size:12px;font-weight:500"> ＋${dv} 由退/缺推算</span>`:''}`,x=>`<b>${x.no}</b><span class="sub">共 ${x.qty} 件</span>`)
   +(mySkip.length?secHTML('skip','跳號','o',mySkip,`${mySkip.length} 個號`,x=>`<b>${x.no}</b><span class="sub">系統沒有這號</span>`):'')
   +(oth.length?secHTML('others',`${P} 範圍`,'o',oth,`<span class="mut" style="font-size:14px;font-weight:500">${oth.length} 筆</span>`,x=>`<b>${x.no}</b><span class="sub">${x._k==='multi'?`多件 共 ${x.qty} 件`:x._k==='skip'?'跳號':`缺件${x.qty>1?` ×${x.qty}`:''}`}</span>`):'');
}
function fListHTML(d){return d.fReturns.length?secHTML('fReturns',`${esc(S.settings.partner)} 退件`,'r',d.fReturns,`${sum(d.fReturns,x=>x.qty)} 件`,x=>`<b>${x.qty} 件</b><span class="sub">${esc(x.reason)}</span>`):''}
function runHeadHTML(d){const c=calc(d);
  return `<div class="hrow"><div><div class="big">${c.delivered}<small> 件</small></div></div><div class="hr"><div class="mid acc">${moneyH(c.pay)}</div></div></div>
  <div class="mut">${c.has?`範圍 ${c.numbers} 號 · 多件 +${c.extra} · 缺件 −${c.myMissing} · 退件 −${c.myRet}`:'先填編號範圍'}</div>
  ${c.has?`<div class="mut" style="margin-top:2px">${esc(S.settings.partner)} ${c.fDelivered??'—'} 件 · 總件數 ${c.T??'—'}</div>`:''}
  ${c.warn.map(w=>`<div class="warnbox">⚠️ ${esc(w)}</div>`).join('')}`}
function refreshDay(){const d=getDay(curDate);
  const set=(id,h)=>{const el=document.getElementById(id);if(el)el.innerHTML=h};
  set('hero',heroHTML(d));set('lists',listsHTML(d));acRefresh();set('flist',fListHTML(d));set('runhead',runHeadHTML(d))}

function setF(k,v){const d=getDay(curDate);d[k]=v;touch('days',d);refreshDay()}
function setSup(k,v){const d=getDay(curDate);d.sup={...(d.sup||{on:false,name:'',fDel:'',sRet:''}),[k]:v};touch('days',d);if(k==='on')render();else refreshDay()}
function setT(k,v){const d=getDay(curDate);d.t={...d.t,[k]:v};touch('days',d);render()}
function durHTML(d){const c=calc(d),ph=c.deliver&&c.has?(c.delivered/(c.deliver/60)).toFixed(1):'—';return `<div class="dur"><div>通勤<b>${hm(c.commute)}</b></div><div>理貨<b>${hm(c.sort)}</b></div><div>送貨<b>${hm(c.deliver)}</b></div><div>件/時<b>${ph}</b></div></div>`}

/* ---- 流程按鈕 ---- */
function step(k){
  const d=getDay(curDate),label=STEPS.find(x=>x[0]===k)[1];
  if(k==='end'&&!confirm('確定送完了嗎？\n會記下送完時間並回到首頁。'))return;
  if(d.t[k]&&!confirm(`${label} 已經記過 ${d.t[k]}，要改成現在 ${nowHM()} 嗎？`))return;
  d.t={...d.t,[k]:nowHM()};touch('days',d);
  if(k==='arrive'||k==='start')openRun();
  else{if(k==='end')exitRun(true);else render()}
  toast(`${label} ${d.t[k]}`);
}
function openRun(){S.ui.run=curDate;S.ui.editRange=false;persist();render();window.scrollTo(0,0)}
function exitRun(silent){S.ui.run=null;persist();render();window.scrollTo(0,0)}

/* ---- 復原 ---- */
let undoSnap=null;
function snap(d){undoSnap={date:d.date,data:JSON.stringify({missing:d.missing,multi:d.multi,returns:d.returns,fReturns:d.fReturns,skip:d.skip||[]})}}
function undo(){if(!undoSnap)return;const d=getDay(undoSnap.date);if(d.locked){toast('這天已鎖定，要先解鎖');return}Object.assign(d,JSON.parse(undoSnap.data));touch('days',d);undoSnap=null;hideUndo();refreshDay();toast('已復原')}
function showUndo(msg){const u=document.getElementById('undo');u.querySelector('span').textContent=msg;u.classList.add('on');clearTimeout(showUndo.t);showUndo.t=setTimeout(hideUndo,6000)}
function hideUndo(){document.getElementById('undo').classList.remove('on')}

/* ---- 快速輸入：輸入編號 → 按按鈕；按鈕不會讓鍵盤收起來 ---- */
let qRet=null;
const keep='onpointerdown="event.preventDefault()" onmousedown="event.preventDefault()"';
function qno(){return document.getElementById('qno')}
function qDraft(v){S.ui.qdraft={date:curDate,v};persist()}
function qClear(){const i=qno();i.value='';qDraft('')}
function qAct(kind){
  const inp=qno(),no=num(inp.value&&inp.value.trim());
  if(no==null){toast('先輸入編號');inp.focus();return}
  const d=getDay(curDate),s=num(d.start),e=num(d.end),inR=s!=null&&e!=null&&no>=s&&no<=e,now=Date.now();
  if(kind==='returns'){qRet=no;document.getElementById('qreason').innerHTML=`<div class="mut" style="margin-top:10px">${no} 退件原因：</div><div class="chips">${S.settings.reasons.map((r,i)=>`<button class="chip pick" ${keep} onclick="qReason(${i})">${esc(r)}</button>`).join('')}<button class="chip pick" ${keep} onclick="qCancel()">取消</button></div>`;return}
  snap(d);let msg;
  if(kind==='skip'){d.skip=d.skip||[];if(d.skip.some(x=>x.no===no)){toast(`${no} 已經記過跳號`);qClear();inp.focus();return}d.skip.push({id:rid(),no,at:now});msg=`跳號 ${no}（系統沒有這個號）`}
  if(kind==='missing'){const x=d.missing.find(m=>m.no===no);if(x){x.qty++;x.at=now;msg=`缺件 ${no} ×${x.qty}`}else{d.missing.push({id:rid(),no,qty:1,at:now});msg=`缺件 ${no}${inR||s==null?'':`（${S.settings.partner} 的）`}`}}
  if(kind==='multi'){let x=d.multi.find(m=>m.no===no);if(x){x.qty++;x.at=now}else{x={id:rid(),no,qty:2,at:now};d.multi.push(x)}msg=`${no} 共 ${x.qty} 件（再按一次 +1）`}
  touch('days',d);refreshDay();showUndo(msg);
  if(kind==='multi'&&s!=null&&!inR)toast(`⚠️ ${no} 不在你的範圍`);
  if(kind==='multi'){inp.focus();inp.select()}else{qClear();inp.focus()}
}
function qReason(i){
  const d=getDay(curDate);snap(d);
  d.returns.push({id:rid(),no:qRet,qty:1,reason:S.settings.reasons[i],at:Date.now()});
  touch('days',d);showUndo(`退件 ${qRet} · ${S.settings.reasons[i]}`);qCancel();refreshDay();
}
function qCancel(){qRet=null;document.getElementById('qreason').innerHTML='';qClear();qno().focus()}
function rmEv(key,id){const d=getDay(curDate);if(d.locked){toast('這天已鎖定');return}const x=d[key].find(y=>y.id===id);if(!x)return;snap(d);d[key]=d[key].filter(y=>y.id!==id);touch('days',d);refreshDay();
  showUndo(`已刪除 ${key==='fReturns'?`${S.settings.partner} 退件 ${x.qty} 件`:({missing:'缺件',multi:'多件',returns:'退件',skip:'跳號'}[key])+' '+x.no}`)}
function addFRet(i){const q=num(document.getElementById('fq').value)||1;const d=getDay(curDate);snap(d);
  d.fReturns.push({id:rid(),qty:q,reason:S.settings.reasons[i],at:Date.now()});touch('days',d);refreshDay();showUndo(`${S.settings.partner} 退件 ${q} 件 · ${S.settings.reasons[i]}`)}

/* ---- 共用區塊 ---- */
function acHTML(d){
  const a=num(d.acStart)??1,b=num(d.acEnd),T=num(d.total);
  let res='<div class="mut">填範圍和總件數，核對多件有沒有標齊</div>';
  if(b!=null&&b>=a&&T!=null){const sk=(d.skip||[]).filter(x=>x.no>=a&&x.no<=b).length,n=b-a+1-sk,need=T-n,marked=sum(d.multi.filter(m=>m.no>=a&&m.no<=b),m=>m.qty-1),left=need-marked;
    res=`<div class="acres ${left===0?'okb':left<0?'badb':''}"><div class="acrow"><span>編號 ${b-a+1}${sk?` − 跳號 ${sk}`:''} = <b>${n}</b> 號</span><span>總 <b>${T}</b> 件</span></div>
      <div class="acrow"><span>多件應有 <b>${need}</b> · 已標 <b>${marked}</b></span><span>${left===0?'✅ 標齊':left>0?`還差 <b>${left}</b>`:`⚠️ 多 ${-left}`}</span></div></div>`}
  return `<div class="card"><h3>全帳號核對（前一晚預標用）</h3><div class="g3">
    <div><label class="f">帳號編號從</label><input inputmode="numeric" pattern="[0-9]*" placeholder="1" value="${esc(d.acStart)}" oninput="setF('acStart',this.value);acRefresh()"></div>
    <div><label class="f">到</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.acEnd)}" oninput="setF('acEnd',this.value);acRefresh()"></div>
    <div><label class="f">總件數</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.total)}" oninput="setF('total',this.value);acRefresh()"></div></div>
    <div id="acres" style="margin-top:10px">${res}</div></div>`}
function acRefresh(){const el=document.getElementById('acres');if(el){const t=document.createElement('div');t.innerHTML=acHTML(getDay(curDate));el.innerHTML=t.querySelector('#acres').innerHTML}}
function rangeHTML(d,noTotal){return `<div class="card"><h3>編號範圍</h3><div class="${noTotal?'g2':'g3'}">
  <div><label class="f">我從</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.start)}" oninput="setF('start',this.value)"></div>
  <div><label class="f">到</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.end)}" oninput="setF('end',this.value)"></div>
  ${noTotal?'':`<div><label class="f">總件數</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.total)}" oninput="setF('total',this.value)"></div>`}</div></div>`}
function quickHTML(){const dv=S.ui.qdraft&&S.ui.qdraft.date===curDate?S.ui.qdraft.v:'';
  return `<div class="card quick">
    <input id="qno" class="qin" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" enterkeyhint="done" placeholder="輸入編號" value="${esc(dv)}" oninput="qDraft(this.value)">
    <div class="g4 qbtn">
      <button class="ev m" ${keep} onclick="qAct('missing')">缺件</button>
      <button class="ev x" ${keep} onclick="qAct('multi')">多件 +1</button>
      <button class="ev r" ${keep} onclick="qAct('returns')">退件</button>
      <button class="ev k" ${keep} onclick="qAct('skip')">跳號</button>
    </div><div id="qreason"></div>
  </div>`}
function partnerHTML(d,c){const P=esc(S.settings.partner);
  return `<label class="f" style="margin-top:12px">${P} 退件：填件數 → 點原因</label>
    <div class="frow"><input id="fq" inputmode="numeric" pattern="[0-9]*" value="1"><div class="chips" style="margin:0">${S.settings.reasons.map((r,i)=>`<button class="chip pick" onclick="addFRet(${i})">${esc(r)}</button>`).join('')}</div></div>
    <div id="flist" style="margin-top:10px">${fListHTML(d)}</div>
    <div class="chips" style="margin-top:12px"><span class="chip pick ${c.supOn?'sel':''}" onclick="setSup('on',${!c.supOn})">${c.supOn?'☑':'☐'} 今天有支援人員</span></div>
    ${c.supOn?`<div class="g3" style="margin-top:8px">
      <div><label class="f">${P} 件數</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.sup.fDel)}" oninput="setSup('fDel',this.value)"></div>
      <div><label class="f">支援退件數</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.sup.sRet)}" oninput="setSup('sRet',this.value)"></div>
      <div><label class="f">支援名字</label><input value="${esc(d.sup.name)}" placeholder="支援" oninput="setSup('name',this.value)"></div>
    </div><small class="hint">支援件數＝總件數扣掉其他人倒推</small>`:''}`}
function stepsHTML(d){
  return `<div class="steps">${STEPS.map(([k,l],i)=>`<div class="stp ${d.t[k]?'ok':''}"><span class="n">${d.t[k]?'✓':i+1}</span><span class="l">${l}</span><input type="time" value="${esc(d.t[k])}" onchange="setT('${k}',this.value)" aria-label="${l}時間"></div>`).join('')}</div>
  <div id="dur">${durHTML(d)}</div>`}

/* ---- 送貨模式（全螢幕，跳出 app 回來也會留在這裡） ---- */
function vRun(){
  curDate=S.ui.run;const d=getDay(curDate),st=stageOf(d),isToday=curDate===today(),delivering=st>=3;
  const head=isToday?(delivering?'送貨中':'點貨中'):'補登件數';
  const showRange=!isToday||!delivering||S.ui.editRange;
  return `<div class="runtop"><button class="sm" onclick="exitRun()">← 首頁</button><b>${head}</b><span class="mut">${md(curDate)}（${wd(curDate)}）</span></div>
  <div class="card" id="runhead">${runHeadHTML(d)}</div>
  ${isToday&&delivering?`<div class="rangeline" onclick="S.ui.editRange=!S.ui.editRange;persist();render()">範圍 ${esc(d.start)||'?'}–${esc(d.end)||'?'} · 總 ${esc(d.total)||'—'}　<span class="acc">${S.ui.editRange?'收起':'修改'}</span></div>`:''}
  ${!(isToday&&delivering)||S.ui.editRange?acHTML(d):''}
  ${showRange?rangeHTML(d,!(isToday&&delivering)||S.ui.editRange):''}
  ${quickHTML()}
  ${isToday&&!delivering?`<button class="pri bigbtn" onclick="step('start')">▶ 點完了，開始送貨</button>`:''}
  <div class="card"><h3>紀錄</h3><div id="lists">${listsHTML(d)}</div></div>
  ${isToday&&delivering?`<button class="pri bigbtn okbg" onclick="step('end')">✓ 送完</button>`:''}
  ${!isToday?`<button class="pri bigbtn" onclick="exitRun()">完成</button>`:''}`;
}

/* ---- 首頁 ---- */
function vDay(){
  const d=getDay(curDate),c=calc(d),st=stageOf(d),isToday=curDate===today(),P=esc(S.settings.partner);
  const dateBar=`<div class="datebar"><button onclick="shiftDate(-7)" aria-label="上一週">◀</button><label class="dpick"><span>📅 ${md(curDate)}（${wd(curDate)}）${isToday?' 今天':''}</span><input type="date" value="${curDate}" onchange="setDate(this.value)"></label><button onclick="shiftDate(7)" aria-label="下一週">▶</button></div>
  <div class="strip">${[0,1,2,3,4,5,6].map(i=>{const x=addDays(weekStart(curDate),i),dd=S.days[x],live=dd&&!dd.deleted,cc=live?calc(dd):null,stt=!live?'':cc.allOff?'all':cc.meOff?'off':dd.locked?'lock':cc.has?'has':'';
    return `<button class="${x===curDate?'on':''} ${x===today()?'td':''}" onclick="setDate('${x}')"><small>${wd(x)}</small><b>${pd(x).getDate()}</b><i class="st ${stt}">${stt==='all'?'休':stt==='off'?'我休':stt==='lock'?'✓':stt==='has'?'•':''}</i></button>`}).join('')}</div>
  ${!isToday?`<button class="sm totoday" onclick="setDate(today())">回到今天</button>`:''}
  <div class="card" id="hero">${heroHTML(d)}</div>`;
  const lockBar=d.locked?`<div class="lockbar"><span>🔒 ${md(curDate)} 已結算</span><button onclick="unlockDay()">解鎖編輯</button></div>`:'';
  const lockBtn=d.locked?'':`<button class="pri done" onclick="lockDay()">✅ 當日結算完成</button>`;
  const delBtn=S.days[curDate]&&!S.days[curDate].deleted?`<button class="sm" style="margin-top:10px;color:var(--bad)" onclick="delDay()">刪除這天紀錄</button>`:'';

  if(c.allOff)return dateBar+lockBar+(d.locked?'':`<div class="card" style="text-align:center"><button onclick="setOff('')">取消休息</button></div>`)+lockBtn;
  if(c.meOff)return dateBar+lockBar+`<fieldset class="lk" ${d.locked?'disabled':''}>
    <div class="card"><h3>同區統計（我休假）</h3>
      <div class="g2"><div><label class="f">總件數</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.total)}" oninput="setF('total',this.value)"></div>
      <div><label class="f">缺件數</label><input inputmode="numeric" pattern="[0-9]*" value="${esc(d.offMiss)}" oninput="setF('offMiss',this.value)"></div></div>
      ${partnerHTML(d,c)}
      <label class="f" style="margin-top:12px">備註</label><textarea rows="2" oninput="setF('note',this.value)">${esc(d.note)}</textarea>
      <div class="row" style="margin-top:10px"><button class="sm" onclick="setOff('')">取消休假</button>${delBtn.replace('margin-top:10px;','')}</div>
    </div></fieldset>${lockBtn}${dedHTML(d)}`;

  const nothing=!c.has&&!d.missing.length&&!d.multi.length&&!d.returns.length&&st===0;
  let next='';
  if(!d.locked){
    if(isToday){
      if(st===0)next=`<div class="g2"><button class="pri bigbtn" onclick="step('leave')">🚗 出門</button><button class="bigbtn" onclick="step('arrive')">直接到倉庫</button></div>`;
      else if(st===1)next=`<button class="pri bigbtn" onclick="step('arrive')">📦 到倉庫，開始點貨</button>`;
      else if(st===2)next=`<button class="pri bigbtn" onclick="openRun()">回到點貨畫面</button>`;
      else if(st===3)next=`<button class="pri bigbtn" onclick="openRun()">🚚 回到送貨模式</button>`;
      else if(st===4)next=`<button class="pri bigbtn" onclick="step('home')">🏠 到家（下班打卡）</button>`;
    }
    next+=`<button class="sm editbtn" onclick="openRun()">✏️ ${isToday?'輸入 / 修改件數':'補登 / 修改件數'}</button>`;
  }
  return dateBar+lockBar+`
  ${nothing&&!d.locked?`<div class="g2" style="margin-bottom:12px"><button class="offbtn" onclick="setOff('me')">🏖 我休假<br><small>同事有上班</small></button><button class="offbtn" onclick="setOff('all')">😴 全員休息<br><small>沒有貨</small></button></div>`:''}
  ${next?`<div class="card nextcard">${next}</div>`:''}
  <fieldset class="lk" ${d.locked?'disabled':''}>
  <div class="card"><h3>今天進度</h3>${stepsHTML(d)}<small class="hint">大按鈕會自動記時間，點時間可修改</small></div>
  <div class="card"><h3>紀錄</h3><div id="lists">${listsHTML(d)}</div></div>
  <div class="card"><h3>收工後</h3>
    <label class="f">今日工作里程（Trip B km）</label>
    <input inputmode="decimal" placeholder="出門前歸零，回家看 B" value="${esc(d.kmB)}" oninput="setF('kmB',this.value)" onchange="render()">
    <div class="mut" style="margin-top:6px">${(()=>{if(c.km==null)return '';const k=costPerKmOn(d.date);
      return `<div>${c.km} km · 油錢約 <b>${money(c.km*k.v)}</b></div><div style="font-size:12px">${k.src==='auto'?`油價 ${money(k.price)}/L · 油耗 ${k.kmPerL.toFixed(2)} km/L`:'暫用備用每公里油錢'}</div>`})()}</div>
    ${partnerHTML(d,c)}
    <label class="f" style="margin-top:12px">備註</label><textarea rows="2" oninput="setF('note',this.value)">${esc(d.note)}</textarea>
    ${delBtn}
  </div>
  </fieldset>
  ${lockBtn}
  ${dedHTML(d)}`;
}
function dedHTML(d){const L=(d.ded||[]).slice().sort((a,b)=>(b.at||0)-(a.at||0));
  return `<div class="card"><h3>扣款 / 賠償</h3>
    ${L.length?`<div class="evlist" style="margin-bottom:10px">${L.map(x=>`<div class="dedr"><div><b class="badc">−${moneyH(Number(x.amount)||0)}</b><div class="sub">${esc(x.note)||'（沒寫原因）'}</div></div><button class="chip pick ${x.confirmed?'sel':''}" onclick="dedToggle('${x.id}')">${x.confirmed?'已扣':'待確認'}</button><button class="del" onclick="dedDel('${x.id}')" aria-label="刪除">✕</button></div>`).join('')}</div>`:''}
    <div class="dedadd"><input id="dedAmt" inputmode="decimal" placeholder="金額 $"><input id="dedNote" placeholder="原因（例：包裹損壞賠償）"><button onclick="dedAdd()">新增</button></div>
    <small class="hint">待確認不扣錢；確定被扣再點成「已扣」</small></div>`}
function dedAdd(){const a=num(document.getElementById('dedAmt').value);if(!(a>0)){toast('請輸入金額');return}
  const d=getDay(curDate);d.ded=[...(d.ded||[]),{id:rid(),amount:a,note:document.getElementById('dedNote').value.trim(),confirmed:false,at:Date.now()}];touch('days',d);render();toast('已記錄（待確認）')}

function delDay(){if(!confirm(`刪除 ${curDate} 的所有紀錄？\n（包含件數、時間、退件，刪除後無法復原）`))return;const d=newDay(curDate);d.deleted=true;touch('days',d);render()}

/* ================= 每週 ================= */
function weeksAgg(){
  const fixed=Number(S.settings.weeklyFixed)||0,W={};
  liveDays().forEach(d=>{const c=calc(d);if(!c.counts&&!c.ded&&!c.dedPend)return;const ws=weekStart(d.date);
    const w=W[ws]||(W[ws]={ws,days:0,me:0,pay:0,f:0,fKnown:true,myRet:0,fRet:0,km:0,fuel:0,sup:0,ded:0,dedPend:0});
    w.ded+=c.ded;w.dedPend+=c.dedPend;if(!c.counts)return;
    if(c.has)w.days++;w.fuel+=dayFuel(d,c);w.me+=c.delivered;w.pay+=c.pay;w.myRet+=c.myRet;w.fRet+=c.fRet;w.km+=c.km||0;
    if(c.fDelivered==null)w.fKnown=false;else w.f+=c.fDelivered;w.sup+=c.sDelivered||0;});
  return Object.values(W).map(w=>({...w,fixed,payNet:w.pay-w.ded,net:w.pay-w.ded-w.fuel-fixed,pd:payday(w.ws),rec:S.weeks[w.ws]})).sort((a,b)=>b.ws<a.ws?-1:1);
}
/* ---- 結算表 ---- */
function settleRange(){const f=S.ui.sFrom||weekStart(today());return[f,S.ui.sTo&&S.ui.sTo>=f?S.ui.sTo:addDays(f,6)]}
function setSettle(kind,v){if(kind==='this'){S.ui.sFrom=weekStart(today());S.ui.sTo=addDays(S.ui.sFrom,6)}
  else if(kind==='last'){S.ui.sFrom=addDays(weekStart(today()),-7);S.ui.sTo=addDays(S.ui.sFrom,6)}
  else if(kind==='from'){S.ui.sFrom=v;if(!S.ui.sTo||S.ui.sTo<v)S.ui.sTo=addDays(weekStart(v),6)}
  else if(kind==='to')S.ui.sTo=v;persist();render()}
function settleData(){const[from,to]=settleRange();
  const all=[],t=today();for(let x=from,i=0;x<=to&&x<=t&&i<93;x=addDays(x,1),i++){const d=getDay(x);const cc=calc(d);all.push({d,c:cc,st:cc.allOff?'off':cc.meOff?'meoff':cc.has?'work':'none'})}
  const rows=all.filter(x=>x.st==='work'||x.st==='meoff');
  const T={total:sum(rows,x=>x.c.T||0),me:sum(rows,x=>x.c.delivered),pay:sum(rows,x=>x.c.pay),f:sum(rows,x=>x.c.fDelivered||0),fMissing:rows.some(x=>x.c.fDelivered==null),off:all.filter(x=>x.st==='off').length,none:all.filter(x=>x.st==='none').length,
    sup:sum(rows,x=>x.c.sDelivered||0),supDays:rows.filter(x=>x.c.supOn).length,work:all.filter(x=>x.st==='work').length,meoff:all.filter(x=>x.st==='meoff').length,myRet:sum(rows,x=>x.c.myRet),fRet:sum(rows,x=>x.c.fRet),sRet:sum(rows,x=>x.c.sRet),
    miss:sum(rows,x=>x.c.myMissing+x.c.otherMissing),ded:sum(all,x=>x.c.ded),dedPend:sum(all,x=>x.c.dedPend)};
  return{from,to,rows,all,T}}
function settleText(){const{from,to,rows,all,T}=settleData(),P=S.settings.partner,M=S.settings.me,rate=Number(S.settings.rate)||0;
  const L=[`${md(from)}–${md(to)} 送貨件數`];
  all.forEach(({d,c,st})=>L.push(st==='off'?`${md(d.date)}(${wd(d.date)}) 全員休息`:st==='none'?`${md(d.date)}(${wd(d.date)}) 未記錄`:`${md(d.date)}(${wd(d.date)}) 總${c.T??'-'}｜${M} ${st==='meoff'?'休假':c.delivered}｜${P} ${c.fDelivered??'-'}${c.supOn?`｜${c.supName} ${c.sDelivered??'-'}`:''}`));
  L.push(`合計：${M} ${T.me} 件 ${money(T.me*rate)}｜${P} ${T.f} 件${T.supDays?`｜支援 ${T.sup} 件`:''}`);
  if(T.ded)L.push(`扣款：−${money(T.ded)}　${M} 實領 ${money(T.me*rate-T.ded)}`);
  L.push(`退件 ${T.myRet+T.fRet+T.sRet} 件　缺件 ${T.miss} 件`);
  return L.join('\n')}
async function copySettle(){const t=settleText();try{await navigator.clipboard.writeText(t);toast('已複製，可直接貼給會計')}

function csvSettle(){const{from,to,rows,all,T}=settleData(),P=S.settings.partner,M=S.settings.me;

  out.push(['合計','',T.total,T.me,T.f,T.sup,T.myRet+T.fRet+T.sRet,T.miss,T.ded||'']);
  out.push([M+' 薪資','',(T.pay).toFixed(2)]);if(T.ded)out.push([M+' 實領（扣款後）','',(T.pay-T.ded).toFixed(2)]);

/* ================= 統計 / 時薪 ================= */
function periodRange(){
  const t=today(),p=S.ui.period;
  if(p==='thisweek'){const w=weekStart(t);return[w,addDays(w,6)]}
  if(p==='lastweek'){const w=addDays(weekStart(t),-7);return[w,addDays(w,6)]}
  if(p==='thismonth'){const d=pd(t);return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))]}
  if(p==='lastmonth'){const d=pd(t);return[ymd(new Date(d.getFullYear(),d.getMonth()-1,1)),ymd(new Date(d.getFullYear(),d.getMonth(),0))]}
  if(p==='custom')return[S.ui.from||'0000-01-01',S.ui.to||'9999-12-31'];
  return['0000-01-01','9999-12-31'];
}
function setUI(path,v){const[a,b]=path.split('.');if(b)S.ui[a][b]=v;else S.ui[a]=v;persist();render()}

  const P=[['thisweek','本週'],['lastweek','上週'],['thismonth','本月'],['lastmonth','上月'],['all','全部'],['custom','自訂']];

  return `
  <div class="card"><div class="chips" style="margin:0">${P.map(([k,l])=>`<span class="chip pick ${S.ui.period===k?'sel':''}" onclick="setUI('period','${k}')">${l}</span>`).join('')}</div>

  </div>
  <div class="card"><h3>收入</h3>
    <div class="kv"><span>送達件數</span><b>${tot.me} 件${tot.n?`（日均 ${(tot.me/tot.n).toFixed(1)}）`:''}</b></div>
    <div class="kv"><span>薪資（稅前）</span><b>${moneyH(tot.pay)}</b></div>
    <div class="kv"><span>里程</span><b>${tot.km} km${tot.n?`（日均 ${(tot.km/tot.n).toFixed(0)}）`:''}</b></div>
    ${tot.ded?`<div class="kv"><span>扣款 / 賠償</span><b>− ${moneyH(tot.ded)}</b></div>`:''}
    <div class="kv"><span>工作油錢</span><b>− ${moneyH(tot.fuel)}</b></div>
    <div class="kv"><span>固定成本</span><b>− ${moneyH(tot.fixed)}</b></div>
    <div class="kv"><span>實際收入</span><b class="okc">${moneyH(tot.net)}</b></div>
  </div>
  <div class="card"><h3>時薪計算器</h3>
    <div class="mut">分子：薪資</div><div class="tog" style="margin:6px 0 10px">${tg('num.ded',N.ded!==false,'扣賠償')}${tg('num.fuel',N.fuel,'扣油錢')}${tg('num.fixed',N.fixed,'扣固定成本')}</div>
    <div class="mut">分母：時間包含</div><div class="tog" style="margin:6px 0">${tg('den.commute',D.commute,'通勤')}${tg('den.sort',D.sort,'理貨')}${tg('den.deliver',D.deliver,'送貨')}</div>
    <div class="big" style="margin-top:12px">${hourly==null?'—':moneyH(hourly)} <small>/ 小時</small></div>
    <div class="formula">${segs.length?`${moneyH(numer)} ÷ ${hm(den)}，用 ${ok.length} 天計算`:'至少勾一種時間'}
    ${days.length-ok.length>0&&segs.length?`<br>⚠️ ${days.length-ok.length} 天時間沒填完整，已排除（分子分母都不算）`:''}
    ${noKm?`<br>⚠️ ${noKm} 天沒填里程，那幾天沒扣到油錢`:''}</div>
  </div>`;
}

/* ================= 設定 ================= */
function addReason(){const v=document.getElementById('newReason').value.trim();if(!v){toast('請輸入原因');return}if(S.settings.reasons.includes(v)){toast('已經有這個原因');return}
  setS('reasons',[...S.settings.reasons,v]);render();toast('已新增')}
function delReason(i){const r=S.settings.reasons[i];if(!confirm(`刪除退件原因「${r}」？\n（以前記過的退件不會受影響）`))return;setS('reasons',S.settings.reasons.filter((_,j)=>j!==i));render()}
function mvReason(i,d){const a=[...S.settings.reasons],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];setS('reasons',a);render()}
function setS(k,v){S.settings[k]=v;touchSettings()}
function setLocal(k,v){S.local[k]=v.trim();persist();badge()}
function vSet(){
  const s=S.settings;
  return `
  <div class="card"><h3>薪資</h3><div class="g2">
    <div><label class="f">每件單價 $</label><input inputmode="decimal" value="${esc(s.rate)}" onchange="setS('rate',Number(this.value)||0)"></div>
    <div><label class="f">週一後幾天發薪</label><input inputmode="numeric" value="${esc(s.payOffset)}" onchange="setS('payOffset',Number(this.value)||13)"></div>
    <div><label class="f">我的名字</label><input value="${esc(s.me)}" onchange="setS('me',this.value)"></div>
    <div><label class="f">同事名字</label><input value="${esc(s.partner)}" onchange="setS('partner',this.value)"></div>
  </div><small class="hint">週一～週日為一週，13 天＝下週日發薪</small></div>
  <div class="card"><h3>成本</h3><div class="g2">
    <div><label class="f">每週固定成本 $</label><input inputmode="decimal" value="${esc(s.weeklyFixed)}" onchange="setS('weeklyFixed',Number(this.value)||0)"></div>
    <div><label class="f">備用每公里油錢 $</label><input inputmode="decimal" value="${esc(s.fuelPerKm)}" onchange="setS('fuelPerKm',Number(this.value)||0)"></div>
  </div><small class="hint">固定成本平均分到當週工作天</small></div>
  <div class="card"><h3>退件原因</h3>
    <div class="evlist">${s.reasons.map((r,i)=>`<div class="rsn"><span>${esc(r)}</span><button class="sm" onclick="mvReason(${i},-1)" ${i===0?'disabled':''} aria-label="上移">↑</button><button class="del" onclick="delReason(${i})" aria-label="刪除">✕</button></div>`).join('')}</div>
    <div class="dedadd" style="grid-template-columns:minmax(0,1fr) auto;margin-top:10px"><input id="newReason" placeholder="新增原因，例如：客人要求改期"><button onclick="addReason()">新增</button></div></div>
  <div class="card"><h3>Google Sheets 同步</h3>
    <label class="f">Apps Script 網址</label><input value="${esc(S.local.url)}" placeholder="https://script.google.com/macros/s/.../exec" onchange="setLocal('url',this.value)">
    <label class="f" style="margin-top:8px">密碼（同 Apps Script TOKEN）</label><input value="${esc(S.local.token)}" onchange="setLocal('token',this.value)">
    <button class="pri" style="width:100%;margin-top:10px" onclick="testConn()">測試連線</button>
    <div id="conn" class="formula" style="display:none"></div>
    <div class="g2" style="margin-top:8px"><button onclick="manualSync()">立即同步</button><button onclick="pull(false)">從雲端下載</button></div>
    <small class="hint">先存手機，有網路自動上傳</small><small class="hint" style="margin-top:0">換手機：填同樣網址密碼 → 從雲端下載</small>
  </div>
  <div class="card"><h3>備份</h3><div class="g2"><button onclick="backup()">下載備份</button><button onclick="document.getElementById('imp').click()">匯入備份</button></div>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="restore(this.files[0])"></div>
  <div class="mut" style="text-align:center;margin:4px 0 12px">ParcelPay ${APP_VERSION} · <a href="#" style="color:var(--acc)" onclick="event.preventDefault();forceUpdate()">強制更新</a></div>`;
}

async function testConn(){
  const o=document.getElementById('conn');o.style.display='block';const say=h=>o.innerHTML=h;
  const u=S.local.url;
  if(!u)return say('❌ 還沒貼 Apps Script 網址');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u))return say('❌ 網址格式不對：要是 https://script.google.com/macros/s/…/exec，不能是 /dev 或編輯器網址');
  if(!navigator.onLine)return say('❌ 手機目前沒有網路');
  say('1/2 連線 Apps Script…');
  try{const r=await fetch(u);const t=await r.text();
    if(!t.includes('API OK'))return say(/<html|<!doctype/i.test(t)?'❌ 連到了，但拿到的是 Google 網頁，不是 API。<br>→ 部署設定「誰可以存取」要選「所有人」，改完要部署成新版本':'❌ 回應不對：'+esc(t.slice(0,80))+'<br>→ 確認貼的是 ParcelPay 的 Apps Script，並已部署新版本');
  }catch(e){return say('❌ 連不到 Apps Script。<br>最常見：部署時「誰可以存取」不是「所有人」（選成「擁有 Google 帳戶的使用者」也不行），或網址複製不完整。')}
  say('2/2 檢查密碼…');
  try{const j=await api({action:'pull'});say(`✅ 連線成功！雲端目前有 ${(j.items||[]).length} 筆資料`);syncErr='';flush();badge()}
  catch(e){say(e.message==='密碼錯誤'?'❌ 密碼錯誤：這裡的密碼要和 Apps Script 第 11 行 TOKEN 一模一樣（含大小寫），而且改完 TOKEN 要再部署新版本':'❌ '+esc(errMsg(e)))}
}

/* ================= 匯出 / 備份 ================= */
function dl(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function csv(rows){return '﻿'+rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function csvDays(){
  const P=S.settings.partner;
  const rows=[['日期','星期','週起','發薪日','總件數','我的範圍','號碼數','多件+','我缺件','我退件','我送達','我薪資',P+'範圍缺件',P+'退件',P+'送達','支援名字','支援送達','支援退件','缺件明細','多件明細','退件明細','公里','油錢','通勤分','理貨分','送貨分','備註']];
  liveDays().sort((a,b)=>a.date<b.date?-1:1).forEach(d=>{const c=calc(d);if(!c.has&&!d.total)return;
    rows.push([d.date,wd(d.date),weekStart(d.date),payday(weekStart(d.date)),d.total,c.has?`${d.start}-${d.end}`:'',c.numbers,c.extra,c.myMissing,c.myRet,c.delivered,c.pay.toFixed(2),c.otherMissing,c.fRet,c.fDelivered??'',c.supOn?c.supName:'',c.sDelivered??'',c.supOn?c.sRet:'',
      d.missing.map(m=>m.qty>1?`${m.no}x${m.qty}`:m.no).join(' '),d.multi.map(m=>`${m.no}x${m.qty}`).join(' '),d.returns.map(x=>`${x.no}x${x.qty}(${x.reason})`).join(' '),c.km??'',c.km!=null?dayFuel(d,c).toFixed(2):'',c.commute??'',c.sort??'',c.deliver??'',d.note])});
  dl(`送貨每日_${today()}.csv`,csv(rows),'text/csv;charset=utf-8');
}
function csvWeeks(){
  const P=S.settings.partner;
  const rows=[['週起','週迄','發薪日','工作天','我送達','我應領',P+'送達','支援送達','我退件',P+'退件','公里','油錢','固定成本','實收','實際入帳','差額']];
  weeksAgg().slice().reverse().forEach(w=>{const rv=w.rec?num(w.rec.received):null;
    rows.push([w.ws,addDays(w.ws,6),w.pd,w.days,w.me,w.pay.toFixed(2),w.fKnown?w.f:'',w.sup,w.myRet,w.fRet,w.km,w.fuel.toFixed(2),w.fixed.toFixed(2),w.net.toFixed(2),rv??'',rv==null?'':(rv-w.pay).toFixed(2)])});
  dl(`送貨每週_${today()}.csv`,csv(rows),'text/csv;charset=utf-8');
}
function backup(){dl(`ParcelPay備份_${today()}.json`,JSON.stringify({days:S.days,fuel:S.fuel,weeks:S.weeks,settings:S.settings},null,1),'application/json')}
function restore(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);
  if(!confirm('匯入會用備份內較新的資料覆蓋，確定？'))return;let n=0;
  ['days','fuel','weeks'].forEach(t=>Object.values(j[t]||{}).forEach(x=>{const l=S[t][x.id];if(!l||(x.updatedAt||0)>=(l.updatedAt||0)){S[t][x.id]=x;S.pending=S.pending.filter(p=>!(p.type===t&&p.id===x.id));S.pending.push({type:t,id:x.id});n++}}));
  if(j.settings){S.settings={...DEF_SETTINGS,...j.settings};S.pending=S.pending.filter(p=>p.type!=='settings');S.pending.push({type:'settings',id:'main'})}
  persist();render();flush();toast(`匯入 ${n} 筆`)}catch(e){toast('檔案格式錯誤')}};r.readAsText(file)}

/* ================= 啟動 ================= */
load();render();
document.addEventListener('focusin',e=>{if(e.target.matches('input:not([type=date]):not([type=time]),textarea'))document.body.classList.add('typing')});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input,textarea'))document.body.classList.remove('typing')},100));
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update()})}).catch(()=>{});
}
async function forceUpdate(){toast('更新中…');try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}location.replace(location.pathname+'?v='+Date.now())}
if(S.local.url)pull(true);
window.addEventListener('online',()=>{syncErr='';flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(tab==='day'&&!document.activeElement.matches('input,textarea'))render();flush()}});
setInterval(()=>{if(S.pending.length&&!syncing)flush()},30000);
</script>
